name: Refresh metadata

on:
  schedule:
    # 07:00 UTC — small hours in the US, so the site is fresh by morning.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: Refresh every show rather than just the stale ones
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Without this, a missing key surfaces as a bare "Set TMDB_API_KEY" from
      # deep in the script, which says nothing about where it was looked for.
      - name: Check the TMDB key is where the job can see it
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then
            echo "Found a repository secret named TMDB_API_KEY (${#TMDB_API_KEY} characters)."
            exit 0
          fi
          echo "::error::No repository secret named TMDB_API_KEY is visible to this job."
          echo "Secrets this job CAN see (values are masked by the runner):"
          echo '${{ toJSON(secrets) }}'
          echo
          echo "If TMDB_API_KEY is absent from that list, it was saved somewhere this"
          echo "job cannot read. The Actions secrets page has separate tabs for Actions,"
          echo "Codespaces and Dependabot, and only the Actions one counts:"
          echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo "Environment secrets are also invisible here, since this job declares no"
          echo "environment. The TMDB field in the app's own Settings tab is separate again."
          exit 1

      - name: Pull seasons, streaming and status from TMDB
        run: node scripts/refresh.mjs ${{ inputs.all && '--all' || '--limit 250' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_REGION: ${{ vars.TMDB_REGION || 'US' }}

      - name: Queue newly premiered shows for approval
        run: node scripts/discover.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_REGION: ${{ vars.TMDB_REGION || 'US' }}

      - name: Commit whatever changed
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh show metadata from TMDB"
          git push
